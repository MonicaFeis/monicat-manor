{% extends 'base.html' %}

{% block title %}Log in · MoniCat Manor{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h1>Log in</h1>
            <form method="post" class="mt-3">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}
                            <div class="text-danger small">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary" aria-label="Log in to your account">Log in</button>
            </form>
            <p class="mt-3 text-muted small">
                Don't have an account? <a href="{% url 'signup' %}">Sign up</a>
            </p>
        </div>
    </div>
{% endblock %}
