{% extends 'base.html' %}

{% block title %}Edit comment · MoniCat Manor{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="h4">Edit your comment</h1>
            <form method="post" class="mt-3">
                {% csrf_token %}
                <textarea name="body" class="form-control mb-2" rows="3">{{ object.body }}</textarea>
                <button type="submit" class="btn btn-primary btn-sm">Save changes</button>
                <a href="{% url 'cat_detail' object.cat.pk %}" class="btn btn-link btn-sm">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
